name: Auto Tag

on:
  push:
    branches:
    - main

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create next tag
        run: |
          LATEST=$(git tag --sort=-v:refname | head -n 1)

          if [ -z "$LATEST" ]; then
            NEXT="0.0.1"
          else
            PATCH=$(echo "$LATEST" | cut -d. -f3)
            NEXT="0.0.$((PATCH + 1))"
          fi

          echo "Creating tag: $NEXT"

          git tag "$NEXT"
          git push origin "$NEXT"
